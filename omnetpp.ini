[General]
network = flora.simulations.LoRaNetworkTest
sim-time-limit = 500s
simtime-resolution = -11

**.loRaNodes[*].app[0].txGuardTime = 20s

result-dir = results
cmdenv-express-mode = false

**.scalar-recording = true
**.vector-recording = true

rng-class = "cMersenneTwister"

# -----------------------------
# FLoRa / INET gateway-server setup
# -----------------------------
**.numberOfGateways = 1
**.numberOfNodes = 5

**.loRaNodes[*].LoRaNic.energySourceModule = "^.IdealEpEnergyStorage"

**.loRaGW[*].numUdpApps = 1
**.loRaGW[0].packetForwarder.localPort = 2000
**.loRaGW[0].packetForwarder.destPort = 1000
**.loRaGW[0].packetForwarder.destAddresses = "networkServer"
**.loRaGW[0].packetForwarder.indexNumber = 0

**.networkServer.numApps = 1
**.networkServer.app[0].typename = "NetworkServerApp"
**.networkServer.app[0].destAddresses = "loRaGW[0]"
**.networkServer.app[0].destPort = 2000
**.networkServer.app[0].localPort = 1000
**.networkServer.app[0].evaluateADRinServer = true
**.networkServer.app[0].adrMethod = "avg"

# -----------------------------
# Our custom sensor application
# -----------------------------
**.loRaNodes[*].numApps = 1
**.loRaNodes[*].app[0].typename = "WaterLeakLoRaApp"

**.loRaNodes[*].app[0].reportInterval = 10s
**.loRaNodes[*].app[0].timeToFirstReport = uniform(0s, 10s)

# Default total leak rate = 0.02 leaks/s.
# Per node = total lambda / numberOfNodes = 0.02 / 5 = 0.004
**.loRaNodes[*].app[0].leakLambda = 0.004

# LoRa radio parameters
**.loRaNodes[*].app[0].initialLoRaTP = 14dBm
**.loRaNodes[*].app[0].initialLoRaCF = 868MHz
**.loRaNodes[*].app[0].initialLoRaSF = 12
**.loRaNodes[*].app[0].initialLoRaBW = 125kHz
**.loRaNodes[*].app[0].initialLoRaCR = 4
**.loRaNodes[*].app[0].initialUseHeader = true
**.loRaNodes[*].app[0].evaluateADRinNode = true
**.loRaNodes[*].app[0].dataSize = 20B

# -----------------------------
# Node/gateway placement
# -----------------------------
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMaxY = 1000m
**.constraintAreaMaxZ = 0m

**.loRaNodes[*].**.initFromDisplayString = false
**.loRaGW[*].**.initFromDisplayString = false

**.loRaGW[0].**.initialX = 500m
**.loRaGW[0].**.initialY = 500m

**.loRaNodes[0].**.initialX = 300m
**.loRaNodes[0].**.initialY = 300m

**.loRaNodes[1].**.initialX = 700m
**.loRaNodes[1].**.initialY = 300m

**.loRaNodes[2].**.initialX = 300m
**.loRaNodes[2].**.initialY = 700m

**.loRaNodes[3].**.initialX = 700m
**.loRaNodes[3].**.initialY = 700m

**.loRaNodes[4].**.initialX = 500m
**.loRaNodes[4].**.initialY = 200m

# -----------------------------
# FLoRa radio medium settings
# -----------------------------
**.radio.radioMediumModule = "LoRaMedium"
**.LoRaMedium.pathLossType = "LoRaLogNormalShadowing"
**.sigma = 3.57
**.minInterferenceTime = 0s
**.maxTransmissionDuration = 4s
**.energyDetection = -110dBm
**.alohaChannelModel = false

*.**.radio.separateTransmissionParts = false
*.**.radio.separateReceptionParts = false

# Cache settings
**.LoRaMedium.mediumLimitCacheType = "LoRaMediumCache"
**.LoRaMedium.rangeFilter = "communicationRange"
**.LoRaMedium.neighborCacheType = "LoRaNeighborCache"
**.LoRaMedium.neighborCache.range = 546m
**.LoRaMedium.neighborCache.refillPeriod = 3000s

# INET delay config used by FLoRa examples
**.ipv4Delayer.config = xmldoc("cloudDelays.xml")

# Energy model can be disabled first if it causes setup problems.
# Enable later after basic run works.
# **.loRaNodes[*].LoRaNic.radio.energyConsumer.typename = "LoRaEnergyConsumer"
# **.loRaNodes[*].**.energySourceModule = "^.IdealEpEnergyStorage"
# **.loRaNodes[*].LoRaNic.radio.energyConsumer.configFile = xmldoc("energyConsumptionParameters.xml")


[Config LeakDebug]
sim-time-limit = 100s

# Total lambda = 1.0 leaks/s, per node = 1.0 / 5 = 0.2
**.loRaNodes[*].app[0].leakLambda = 0.2
**.loRaNodes[*].app[0].reportInterval = 10s


[Config LowLeakRate]
sim-time-limit = 3600s

# Total lambda = 0.005, per node = 0.001
**.loRaNodes[*].app[0].leakLambda = 0.001


[Config MediumLeakRate]
sim-time-limit = 3600s

# Total lambda = 0.02, per node = 0.004
**.loRaNodes[*].app[0].leakLambda = 0.004


[Config HighLeakRate]
sim-time-limit = 3600s

# Total lambda = 0.08, per node = 0.016
**.loRaNodes[*].app[0].leakLambda = 0.016


[Config VeryHighLeakRate]
sim-time-limit = 3600s

# Total lambda = 0.2, per node = 0.04
**.loRaNodes[*].app[0].leakLambda = 0.04